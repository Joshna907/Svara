services:
  # Always-on LiveKit worker. It joins a room only when the web app requests it.
  - type: worker
    name: svara-agent
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_AGENT_NAME
        value: digital-twin
      - key: TWIN_NAME
        value: Jothsana
      - key: PROFILE_PATH
        value: knowledge/personal_profile.md
      - key: ENABLE_NOISE_CANCELLATION
        value: "true"
      - key: ALLOW_INTERRUPTION
        value: "true"

  # Public recruiter-facing website and secure token endpoint.
  - type: web
    name: svara-web
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start -- -p $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: AGENT_NAME
        value: digital-twin
      - key: NEXT_PUBLIC_GITHUB_URL
        value: https://github.com/Joshna907/Svara
